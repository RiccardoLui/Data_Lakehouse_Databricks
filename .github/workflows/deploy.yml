name: Deploy Databricks bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: databricks-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$DATABRICKS_HOST" || (echo "Missing DATABRICKS_HOST" && exit 1)
          test -n "$DATABRICKS_TOKEN" || (echo "Missing DATABRICKS_TOKEN" && exit 1)

      - name: Validate bundle
        run: databricks bundle validate --target prod

      - name: Deploy bundle
        run: databricks bundle deploy --target prod

      - name: Show deployed resources
        run: databricks bundle summary --target prod
